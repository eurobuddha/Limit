    <label>TestUSDT:</label><input id="cfgToken" value="0xA9BC089F11816CEB4A84066DFBAFFD0026A81F6957AC13A405F182AFB87DDC6A" style="width:520px">

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════════
function NODE_A() { return document.getElementById('cfgNodeA').value.replace(/\/$/, '') + '/'; }
function NODE_B() { return document.getElementById('cfgNodeB').value.replace(/\/$/, '') + '/'; }
function TOKEN_ID() { return document.getElementById('cfgToken').value; }

var SCRIPT_V3 = 'IF SIGNEDBY(PREVSTATE(0)) THEN ASSERT VERIFYOUT(@INPUT PREVSTATE(1) @AMOUNT @TOKENID FALSE) RETURN TRUE ENDIF IF @COINAGE GT 1500 THEN ASSERT VERIFYOUT(@INPUT PREVSTATE(1) @AMOUNT @TOKENID FALSE) RETURN TRUE ENDIF ASSERT VERIFYOUT(@INPUT PREVSTATE(1) PREVSTATE(2) PREVSTATE(3) FALSE) RETURN TRUE';
var SCRIPT_ADDR_V3 = '0xE0325CC04B1BA1FC630D5E2B157976D01F76507D2049BD9D7D8029A318782BC7';

var ID_A = { pubkey: '', hexaddr: '', miniaddr: '' };
var ID_B = { pubkey: '', hexaddr: '', miniaddr: '' };

var STOP_REQUESTED = false;
var SUITE_START_SNAPSHOT = null;

// ═══════════════════════════════════════════════════════════════
// RPC LAYER
// ═══════════════════════════════════════════════════════════════
async function rpc(nodeUrl, cmd) {
    var url = nodeUrl + encodeURIComponent(cmd);
    globalLog('CMD', nodeUrl === NODE_A() ? 'A' : 'B', cmd);
    try {
        var resp = await fetch(url);
        var json = await resp.json();
        if (json.status === false) {
            globalLog('ERR', nodeUrl === NODE_A() ? 'A' : 'B', json.error || JSON.stringify(json).substring(0, 200));
        } else {
            globalLog('RES', nodeUrl === NODE_A() ? 'A' : 'B', JSON.stringify(json.response || json).substring(0, 300));
        }
        return json;
    } catch(e) {
        globalLog('ERR', nodeUrl === NODE_A() ? 'A' : 'B', e.message);
        throw e;
    }
}
async function rpcA(cmd) { return rpc(NODE_A(), cmd); }
async function rpcB(cmd) { return rpc(NODE_B(), cmd); }

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function getState(coin, port) {
    if (!coin || !coin.state) return null;
    var s = coin.state.find(function(st) { return st.port === port || st.port === String(port); });
    return s ? s.data : null;
}

async function getBalance(nodeUrl, tokenid) {
    var r = await rpc(nodeUrl, 'balance');
    if (!r.status) return { confirmed: '0', sendable: '0', unconfirmed: '0' };
    var tok = (r.response || []).find(function(b) { return b.tokenid === tokenid; });
    if (!tok) return { confirmed: '0', sendable: '0', unconfirmed: '0' };
    return { confirmed: tok.confirmed, sendable: tok.sendable, unconfirmed: tok.unconfirmed || '0' };
}

async function getCoinsAt(nodeUrl, addr) {
    var r = await rpc(nodeUrl, 'coins address:' + addr);
    if (!r.status) return [];
    return r.response || [];
}

async function getAddress(nodeUrl) {
    var r = await rpc(nodeUrl, 'getaddress');
    if (!r.status) throw new Error('getaddress failed');
    return {
        pubkey: r.response.publickey,
        address: r.response.hexaddress || r.response.address,
        miniaddress: r.response.miniaddress
    };
}

async function waitForBlock(nodeUrl, count) {
    count = count || 1;
    var r = await rpc(nodeUrl, 'block');
    var startBlock = parseInt(r.response.block);
    var waited = 0;
    while (waited < 120000) {
        await sleep(3000);
        waited += 3000;
        var r2 = await rpc(nodeUrl, 'block');
        var now = parseInt(r2.response.block);
        if (now >= startBlock + count) return now;
    }
    throw new Error('Timed out waiting for block advance (120s)');
}

async function snapshot() {
    var aMinima = await getBalance(NODE_A(), '0x00');
    var bMinima = await getBalance(NODE_B(), '0x00');
    var aToken  = await getBalance(NODE_A(), TOKEN_ID());
    var bToken  = await getBalance(NODE_B(), TOKEN_ID());
    var script  = await getCoinsAt(NODE_A(), SCRIPT_ADDR_V3);
    return {
        a_minima: parseFloat(aMinima.confirmed) + parseFloat(aMinima.unconfirmed || 0),
        b_minima: parseFloat(bMinima.confirmed) + parseFloat(bMinima.unconfirmed || 0),
        a_token:  parseFloat(aToken.confirmed) + parseFloat(aToken.unconfirmed || 0),
        b_token:  parseFloat(bToken.confirmed) + parseFloat(bToken.unconfirmed || 0),
        a_minima_sendable: parseFloat(aMinima.sendable),
        b_minima_sendable: parseFloat(bMinima.sendable),
        a_token_sendable:  parseFloat(aToken.sendable),
        b_token_sendable:  parseFloat(bToken.sendable),
        script_coins: script.length,
        script_detail: script
    };
}

function assertConserved(before, after, tolerance) {
    tolerance = tolerance || 0.001;
    var totalMinimaBefore = before.a_minima + before.b_minima;
    var totalMinimaAfter  = after.a_minima + after.b_minima;
    var totalTokenBefore  = before.a_token + before.b_token;
    var totalTokenAfter   = after.a_token + after.b_token;
    // Include script coins - they hold Minima or tokens
    // Conservation is approximate because script coins are visible to both nodes
    var dMinima = Math.abs(totalMinimaAfter - totalMinimaBefore);
    var dToken  = Math.abs(totalTokenAfter - totalTokenBefore);
    if (dMinima > tolerance) throw new Error('Conservation violated: Minima delta=' + dMinima + ' (before=' + totalMinimaBefore + ' after=' + totalMinimaAfter + ')');
    if (dToken > tolerance) throw new Error('Conservation violated: Token delta=' + dToken + ' (before=' + totalTokenBefore + ' after=' + totalTokenAfter + ')');
}

async function cleanup(nodeUrl) {
    var r = await rpc(nodeUrl, 'txnlist');
    if (!r.status || !r.response) return;
    var txns = r.response;
    for (var i = 0; i < txns.length; i++) {
        var name = txns[i].transaction || txns[i].id || txns[i];
        if (typeof name === 'string' && name.indexOf('test_') === 0) {
            await rpc(nodeUrl, 'txndelete id:' + name);
        } else if (typeof name === 'object' && name.id && name.id.indexOf('test_') === 0) {
            await rpc(nodeUrl, 'txndelete id:' + name.id);
        }
    }
}

async function cleanupBoth() {
    await cleanup(NODE_A());
    await cleanup(NODE_B());
}

async function cancelOrder(nodeUrl, coinid, coin, identity) {
    var txid = 'test_cleanup_' + Date.now();
    var isMinima = (!coin.tokenid || coin.tokenid === '0x00');
    var amt = isMinima ? coin.amount : coin.tokenamount;
    var cmds = [
        'txncreate id:' + txid,
        'txninput id:' + txid + ' coinid:' + coinid,
        'txnoutput id:' + txid + ' amount:' + amt + ' address:' + identity.hexaddr + (isMinima ? '' : ' tokenid:' + coin.tokenid) + ' storestate:false',
        'txnsign id:' + txid + ' publickey:' + identity.pubkey,
        'txnbasics id:' + txid,
        'txnpost id:' + txid
    ];
    for (var i = 0; i < cmds.length; i++) {
        var r = await rpc(nodeUrl, cmds[i]);
        if (!r.status) {
            await rpc(nodeUrl, 'txndelete id:' + txid);
            throw new Error('Cancel failed at step: ' + cmds[i] + ' err: ' + (r.error || ''));
        }
    }
    await rpc(nodeUrl, 'txndelete id:' + txid);
}

async function cancelAllOrders() {
    var coins = await getCoinsAt(NODE_A(), SCRIPT_ADDR_V3);
    for (var i = 0; i < coins.length; i++) {
        var c = coins[i];
        var ownerKey = getState(c, 0);
        if (ownerKey === ID_A.pubkey) {
            try { await cancelOrder(NODE_A(), c.coinid, c, ID_A); } catch(e) { /* ignore */ }
        }
    }
    if (coins.length > 0) await waitForBlock(NODE_A());
}

async function buildTx(nodeUrl, txid, steps) {
    for (var i = 0; i < steps.length; i++) {
        var r = await rpc(nodeUrl, steps[i]);
        if (!r.status) {
            await rpc(nodeUrl, 'txndelete id:' + txid);
            throw new Error('buildTx failed at step ' + i + ': ' + steps[i] + ' => ' + (r.error || JSON.stringify(r)));
        }
    }
}

// Convert readable tag to valid hex: hash the string to get a deterministic hex ID
function tagToHex(tag) {
    var h = 0;
    for (var i = 0; i < tag.length; i++) { h = ((h << 5) - h + tag.charCodeAt(i)) & 0xFFFFFFFF; }
    return '0x' + ('00000000' + (h >>> 0).toString(16).toUpperCase()).slice(-8);
}
var TAG_MAP = {}; // tag → hex, for reverse lookup in logs

async function createSellOrder(amt, price, tag) {
    var orderId = tagToHex(tag);
    TAG_MAP[orderId] = tag;
    var wantAmt = String(parseFloat(amt) * parseFloat(price));
    var stateJson = '{"0":"' + ID_A.pubkey + '","1":"' + ID_A.hexaddr + '","2":"' + wantAmt + '","3":"' + TOKEN_ID() + '","4":"' + orderId + '","5":"1","6":"' + price + '"}';
    var cmd = 'send amount:' + amt + ' address:' + SCRIPT_ADDR_V3 + " state:" + stateJson;
    var r = await rpcA(cmd);
    if (!r.status) throw new Error('createSellOrder failed: ' + (r.error || ''));
    return r;
}

async function createBuyOrder(amt, price, tag) {
    var orderId = tagToHex(tag);
    TAG_MAP[orderId] = tag;
    var stateJson = '{"0":"' + ID_A.pubkey + '","1":"' + ID_A.hexaddr + '","2":"' + String(parseFloat(amt) / parseFloat(price)) + '","3":"0x00","4":"' + orderId + '","5":"0","6":"' + price + '"}';
    var cmd = 'send amount:' + amt + ' address:' + SCRIPT_ADDR_V3 + ' tokenid:' + TOKEN_ID() + " state:" + stateJson;
    var r = await rpcA(cmd);
    if (!r.status) throw new Error('createBuyOrder failed: ' + (r.error || ''));
    return r;
}

async function findOrderCoin(tag) {
    var hex = tagToHex(tag);
    var coins = await getCoinsAt(NODE_A(), SCRIPT_ADDR_V3);
    for (var i = 0; i < coins.length; i++) {
        var oid = getState(coins[i], 4);
        if (oid === hex) return coins[i];
    }
    return null;
}

async function findCoinForToken(nodeUrl, tokenid, minAmt) {
    var r = await rpc(nodeUrl, 'coins sendable:true');
    if (!r.status) return null;
    var coins = r.response || [];
    for (var i = 0; i < coins.length; i++) {
        var c = coins[i];
        if (c.tokenid === tokenid) {
            var amt = (tokenid === '0x00') ? parseFloat(c.amount) : parseFloat(c.tokenamount);
            if (!minAmt || amt >= parseFloat(minAmt)) return c;
        }
    }
    return null;
}

// ═══════════════════════════════════════════════════════════════
// TEST FRAMEWORK
// ═══════════════════════════════════════════════════════════════
var TESTS = [];
function test(name, fn) {
    TESTS.push({ name: name, fn: fn, status: 'pending', error: null, log: [], duration: 0 });
}

function makeContext(t) {
    return {
        log: function(msg) {
            t.log.push('[' + new Date().toISOString().substr(11, 12) + '] ' + msg);
        },
        assert: function(cond, msg) {
            if (!cond) throw new Error('Assertion failed: ' + (msg || ''));
        },
        assertEq: function(a, b, msg) {
            if (String(a) !== String(b)) throw new Error('assertEq failed: ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b) + (msg ? ' (' + msg + ')' : ''));
        }
    };
}

// ═══════════════════════════════════════════════════════════════
// GLOBAL LOG
// ═══════════════════════════════════════════════════════════════
function globalLog(type, node, msg) {
    var panel = document.getElementById('logPanel');
    var cls = type === 'ERR' ? 'err' : type === 'CMD' ? 'cmd' : 'res';
    var line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="ts">' + new Date().toISOString().substr(11, 12) + '</span> '
        + '<span class="' + cls + '">[' + node + '] ' + escHtml(String(msg)) + '</span>';
    panel.appendChild(line);
    panel.scrollTop = panel.scrollHeight;
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════════
// UI RENDERING
// ═══════════════════════════════════════════════════════════════
var PHASES = {
    'T0': 'Phase 0 -- Setup',
    'T1': 'Phase 1 -- Create Orders',
    'T2': 'Phase 2 -- Cancel Orders',
    'T3': 'Phase 3 -- Fill Orders',
    'T4': 'Phase 4 -- Refresh Orders',
    'T6': 'Phase 6 -- Security & Edge Cases',
    'T7': 'Phase 7 -- Full Round Trip',
    'T8': 'Phase 8 -- Exploitation Attacks',
    'T9': 'Phase 9 -- Chaos Monkey',
    'TA': 'Phase 10 -- MiniDapp Install'
};

function renderTests() {
    var panel = document.getElementById('testPanel');
    panel.innerHTML = '';
    var lastPhase = '';
    for (var i = 0; i < TESTS.length; i++) {
        var t = TESTS[i];
        var phase = t.name.substring(0, 2);
        if (phase !== lastPhase) {
            var ph = document.createElement('div');
            ph.className = 'phase-header';
            ph.textContent = PHASES[phase] || phase;
            panel.appendChild(ph);
            lastPhase = phase;
        }
        var icon = t.status === 'pass' ? '&#9989;' : t.status === 'fail' ? '&#10060;' : t.status === 'running' ? '&#128260;' : t.status === 'skip' ? '&#9197;' : '&#11036;';
        var row = document.createElement('div');
        row.className = 'test-row ' + t.status;
        row.setAttribute('data-idx', i);
        row.innerHTML = '<span class="icon">' + icon + '</span><span class="name">' + escHtml(t.name) + '</span><span class="dur">' + (t.duration ? (t.duration / 1000).toFixed(1) + 's' : '') + '</span>';
        row.onclick = (function(idx) { return function() { toggleDetail(idx); }; })(i);
        panel.appendChild(row);

        var detail = document.createElement('div');
        detail.className = 'test-detail';
        detail.id = 'detail-' + i;
        var logHtml = t.log.map(function(l) { return escHtml(l); }).join('\n');
        if (t.error) logHtml += '\n<span class="err">ERROR: ' + escHtml(t.error) + '</span>';
        if (t.status === 'pass') logHtml += '\n<span class="ok">PASSED</span>';
        detail.innerHTML = logHtml || '(no log)';
        panel.appendChild(detail);
    }
}

function toggleDetail(idx) {
    var el = document.getElementById('detail-' + idx);
    if (el) el.classList.toggle('open');
}

function updateSummary() {
    var pass = 0, fail = 0, skip = 0, total = TESTS.length;
    for (var i = 0; i < TESTS.length; i++) {
        if (TESTS[i].status === 'pass') pass++;
        if (TESTS[i].status === 'fail') fail++;
        if (TESTS[i].status === 'skip') skip++;
    }
    var bar = document.getElementById('summaryBar');
    bar.innerHTML = '<span class="pass">' + pass + '/' + total + ' passed</span>'
        + ' | <span class="fail">' + fail + ' failed</span>'
        + ' | <span class="skip">' + skip + ' skipped</span>';
}

async function updateNodeStatus() {
    try {
        var rA = await rpc(NODE_A(), 'status');
        document.getElementById('dotA').className = 'dot ' + (rA.status ? 'ok' : 'err');
        document.getElementById('nodeAInfo').textContent = NODE_A().replace('http://','') + ' Block #' + (rA.response ? rA.response.chain.block : '?');
    } catch(e) {
        document.getElementById('dotA').className = 'dot err';
        document.getElementById('nodeAInfo').textContent = NODE_A().replace('http://','') + ' OFFLINE';
    }
    try {
        var rB = await rpc(NODE_B(), 'status');
        document.getElementById('dotB').className = 'dot ' + (rB.status ? 'ok' : 'err');
        document.getElementById('nodeBInfo').textContent = NODE_B().replace('http://','') + ' Block #' + (rB.response ? rB.response.chain.block : '?');
    } catch(e) {
        document.getElementById('dotB').className = 'dot err';
        document.getElementById('nodeBInfo').textContent = NODE_B().replace('http://','') + ' OFFLINE';
    }
}

// ═══════════════════════════════════════════════════════════════
// TEST DEFINITIONS
// ═══════════════════════════════════════════════════════════════

// -------- Phase 0: Setup --------

test('T0.1 -- Node Connectivity', async function(t) {
    var rA = await rpcA('status');
    t.assert(rA.status === true, 'Node A status failed');
    t.log('Node A: version=' + rA.response.version + ' block=' + rA.response.chain.block);

    var rB = await rpcB('status');
    t.assert(rB.status === true, 'Node B status failed');
    t.log('Node B: version=' + rB.response.version + ' block=' + rB.response.chain.block);

    var blockA = parseInt(rA.response.chain.block);

    await rpcA('txndelete id:' + cancelId);
    await rpcB('txndelete id:' + fillId);

    await waitForBlock(NODE_A());

    var still = await findOrderCoin('CANCELRACE01');

    ]);

test('T9.7 -- Rapid Cancel-Recreate', async function(t) {
    var before = await snapshot();

    await createSellOrder('5', '0.5', 'RECREATE01');
    await waitForBlock(NODE_A());

    var coin = await findOrderCoin('RECREATE01');
    t.assert(coin, 'Order not found');

    // Cancel
    await cancelOrder(NODE_A(), coin.coinid, coin, ID_A);
    t.log('Cancelled');

    // Immediately recreate (same tag) without waiting for block
    try {
        await createSellOrder('5', '0.6', 'RECREATE02');
        t.log('Recreate sent immediately');
    } catch(e) {
        t.log('Recreate failed (expected — UTXO lock): ' + e.message);
    }

    await waitForBlock(NODE_A());
    await waitForBlock(NODE_A());

    // Check final state
    var coins = await getCoinsAt(NODE_A(), SCRIPT_ADDR_V3);
    var myCoins = coins.filter(function(c) { return getState(c, 0) === ID_A.pubkey; });
    t.log(myCoins.length + ' order(s) at script after cancel-recreate');

    // Cleanup any remaining
    for (var i = 0; i < myCoins.length; i++) {
        try { await cancelOrder(NODE_A(), myCoins[i].coinid, myCoins[i], ID_A); } catch(e) {}
    }
    if (myCoins.length > 0) await waitForBlock(NODE_A());

    var after = await snapshot();
    assertConserved(before, after, 0.1);
    t.log('No coins lost in rapid cancel-recreate');
});

async function runAll() {
    STOP_REQUESTED = false;
    document.getElementById('btnRun').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('logPanel').innerHTML = '';

    // Reset all tests
    for (var i = 0; i < TESTS.length; i++) {
        TESTS[i].status = 'pending';
        TESTS[i].error = null;
        TESTS[i].log = [];
        TESTS[i].duration = 0;
    }
    renderTests();

    // Take suite start snapshot after setup
    var setupDone = false;

    for (var i = 0; i < TESTS.length; i++) {
        if (STOP_REQUESTED) {
            for (var j = i; j < TESTS.length; j++) TESTS[j].status = 'skip';
            renderTests();
            break;
        }

        var t = TESTS[i];
        t.status = 'running';
        renderTests();

        var ctx = makeContext(t);
        var start = Date.now();
        try {
            await t.fn(ctx);
            t.status = 'pass';
        } catch(e) {
            t.status = 'fail';
            t.error = e.message || String(e);
        }
        t.duration = Date.now() - start;

        // Cleanup between tests
        await cleanupBoth();

        // Capture suite start snapshot after Phase 0 completes
        if (t.name.indexOf('T0.4') === 0 && t.status === 'pass') {
            SUITE_START_SNAPSHOT = await snapshot();
        }

        renderTests();
        updateSummary();
        await updateNodeStatus();
    }

    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    updateSummary();
}

function stopTests() {
    STOP_REQUESTED = true;
    document.getElementById('btnStop').disabled = true;
}

async function runCleanup() {
    globalLog('CMD', 'SYS', 'Running full cleanup...');
    await cleanupBoth();
    await cancelAllOrders();
    globalLog('RES', 'SYS', 'Cleanup complete');
}

function copyResults() {
    var lines = [];
    var lastPhase = '';
    for (var i = 0; i < TESTS.length; i++) {
        var t = TESTS[i];
        var phase = t.name.substring(0, 2);
        if (phase !== lastPhase) { lines.push(PHASES[phase] || phase); lastPhase = phase; }
        var icon = t.status === 'pass' ? '\u2705' : t.status === 'fail' ? '\u274C' : t.status === 'skip' ? '\u23ED' : '\u2B1C';
        var dur = (t.duration / 1000).toFixed(1) + 's';
        lines.push(icon + ' ' + t.name + '  ' + dur);
        if (t.error) lines.push('  ERROR: ' + t.error);
        if (t.log.length > 0) t.log.forEach(function(l) { lines.push('  ' + l); });
    }
    navigator.clipboard.writeText(lines.join('\n')).then(function() { alert('Results copied'); });
}

function copyLog() {
    var panel = document.getElementById('logPanel');
    var lines = [];
    for (var i = 0; i < panel.children.length; i++) {
        lines.push(panel.children[i].textContent);
    }
    navigator.clipboard.writeText(lines.join('\n')).then(function() { alert('Log copied'); });
}
